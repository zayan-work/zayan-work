name: Refresh profile README

# Runs 30 minutes after DEV//IDENTITY's GitHub sync so the activity numbers are current.
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/refresh.sh .
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Commit if the content changed
        run: |
          # The footer date changes daily; ignore it so only real changes create commits.
          if git diff --quiet -I '^\*Generated by DEV//IDENTITY on ' -- README.md widgets; then
            git checkout -- README.md widgets
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md widgets
          git commit -m 'chore: refresh profile README'
          git push
